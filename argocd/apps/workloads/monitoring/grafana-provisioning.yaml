apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: cluster-dashboards
        orgId: 1
        folder: Cluster Workloads
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  devops-demo.json: |
    {
      "uid": "devops-demo",
      "title": "DevOps Demo (sample-nodejs)",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Target Status",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "up{job=\"devops-demo\"}", "refId": "A" }],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Total /my-app Hits",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "root_access_total{job=\"devops-demo\"}", "refId": "A" }]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Resident Memory",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "process_resident_memory_bytes{job=\"devops-demo\"}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Event Loop Lag",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "nodejs_eventloop_lag_seconds{job=\"devops-demo\"}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "/my-app Request Rate",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "rate(root_access_total{job=\"devops-demo\"}[5m])", "legendFormat": "req/s", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Node.js Heap Used vs Total",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "nodejs_heap_size_used_bytes{job=\"devops-demo\"}", "legendFormat": "Heap Used", "refId": "A" },
            { "expr": "nodejs_heap_size_total_bytes{job=\"devops-demo\"}", "legendFormat": "Heap Total", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU Usage (cores)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "rate(process_cpu_seconds_total{job=\"devops-demo\"}[5m])", "legendFormat": "CPU", "refId": "A" }]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Active Handles",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "nodejs_active_handles_total{job=\"devops-demo\"}", "legendFormat": "Handles", "refId": "A" }]
        }
      ]
    }
  mongodb-replicaset.json: |
    {
      "uid": "mongodb-replicaset",
      "title": "MongoDB ReplicaSet",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Replicas Up",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(mongodb_up{job=\"mongodb\"})", "refId": "A" }]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Replica Health by Pod",
          "gridPos": { "h": 4, "w": 10, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "mongodb_up{job=\"mongodb\"}", "legendFormat": "{{instance}}", "refId": "A" }],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Current Connections (Total)",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(mongodb_ss_connections{job=\"mongodb\",conn_type=\"current\"})", "refId": "A" }]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Connections by Replica",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "mongodb_ss_connections{job=\"mongodb\",conn_type=\"current\"}", "legendFormat": "{{instance}}", "refId": "A" }]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Operations / sec by Type",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (legacy_op_type) (rate(mongodb_ss_opcounters{job=\"mongodb\"}[5m]))", "legendFormat": "{{legacy_op_type}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Resident Memory by Replica (MiB)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "mongodb_ss_mem_resident{job=\"mongodb\"}", "legendFormat": "{{instance}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "mbytes" } }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Network Traffic (bytes/s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum by (instance) (rate(mongodb_ss_network_bytesIn{job=\"mongodb\"}[5m]))", "legendFormat": "{{instance}} in", "refId": "A" },
            { "expr": "sum by (instance) (rate(mongodb_ss_network_bytesOut{job=\"mongodb\"}[5m]))", "legendFormat": "{{instance}} out", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" } }
        }
      ]
    }
