name: "RKE2 VMs Power Management"

on:
  schedule:
    # Run hourly across 20:00–04:59 UTC (covers 23:00–06:59 Asia/Jerusalem in both IST UTC+2 and IDT UTC+3).
    # Minute 17 avoids top-of-hour (:00) GitHub Actions queue congestion; the script enforces the local hour window.
    - cron: "17 20-23,0-4 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Power action to perform on RKE2 VMs"
        required: true
        default: "stop"
        type: choice
        options:
          - stop
          - start

permissions:
  contents: read
  id-token: write

concurrency:
  group: opentofu-infra
  cancel-in-progress: false
  queue: max

jobs:
  power:
    name: "Manage RKE2 VMs Power State"
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ github.event.inputs.action || 'stop' }}
      ENFORCE_SHUTDOWN_WINDOW: ${{ github.event_name == 'schedule' }}
      CLUSTER_LABEL: "rke2"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Stop Running RKE2 VMs
        if: env.ACTION == 'stop'
        run: .github/scripts/manage-rke2-vms.sh stop

      - name: Start Stopped RKE2 VMs
        if: env.ACTION == 'start'
        run: .github/scripts/manage-rke2-vms.sh start
